<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Family dashboard</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #1a2332;
      --text-muted: #5a6577;
      --border: #e2e8f0;
      --accent: #2b6cb0;
      --accent-soft: #ebf4ff;
      --eleanor: #6b46c1;
      --eleanor-soft: #f3e8ff;
      --oliver: #0d9488;
      --oliver-soft: #ccfbf1;
      --test: #c53030;
      --test-bg: #fff5f5;
      --homework: #b7791f;
      --homework-bg: #fffff0;
      --revision: #2b6cb0;
      --revision-bg: #ebf8ff;
      --parent: #c05621;
      --parent-bg: #fffaf0;
      --event: #2f855a;
      --event-bg: #f0fff4;
      --today: #dd6b20;
      --tomorrow: #3182ce;
      --overdue: #e53e3e;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(26, 35, 50, 0.06), 0 4px 12px rgba(26, 35, 50, 0.04);
      --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    header .sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .lang-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
      padding-top: 0.2rem;
    }

    .lang-toggle button {
      appearance: none;
      border: none;
      background: transparent;
      font: inherit;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
    }

    .lang-toggle button:hover { color: var(--text); }
    .lang-toggle button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .lang-toggle button.active {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .lang-toggle .sep { color: var(--border); user-select: none; }

    .kids-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }

    .kid-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .kid-pill.eleanor { background: var(--eleanor-soft); color: var(--eleanor); }
    .kid-pill.oliver { background: var(--oliver-soft); color: var(--oliver); }

    .updated {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 0.65rem 0;
      border-bottom: 1px solid transparent;
    }

    .filters.is-stuck {
      border-bottom-color: var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .chip {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .chip:hover { border-color: #a0aec0; color: var(--text); }
    .chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .chip.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    section {
      margin-bottom: 1.75rem;
    }

    section h2 {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    section h2 .count {
      background: var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      letter-spacing: 0;
      text-transform: none;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 0.9rem 1rem;
      border-left: 4px solid var(--border);
      transition: border-color 0.15s;
    }

    .card.urgency-overdue { border-left-color: var(--overdue); background: #fffafa; }
    .card.urgency-today { border-left-color: var(--today); }
    .card.urgency-tomorrow { border-left-color: var(--tomorrow); }
    .card.type-test { /* keep urgency override */ }
    .card.type-parent_action { border-left-color: var(--parent); }

    .card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem 0.55rem;
      margin-bottom: 0.4rem;
    }

    .date-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .urgency-tag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .urgency-tag.overdue { background: #fed7d7; color: var(--overdue); }
    .urgency-tag.today { background: #feebc8; color: #c05621; }
    .urgency-tag.tomorrow { background: #bee3f8; color: #2b6cb0; }
    .urgency-tag.ongoing { background: #e9d8fd; color: #6b46c1; }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.18rem 0.5rem;
      border-radius: 4px;
    }

    .badge.test { background: var(--test-bg); color: var(--test); }
    .badge.homework { background: var(--homework-bg); color: var(--homework); }
    .badge.revision { background: var(--revision-bg); color: var(--revision); }
    .badge.parent_action { background: var(--parent-bg); color: var(--parent); }
    .badge.event { background: var(--event-bg); color: var(--event); }

    .optional-flag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.18rem 0.5rem;
      border-radius: 4px;
      background: #edf2f7;
      color: #4a5568;
      border: 1px dashed #a0aec0;
    }

    .child-tag {
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: auto;
    }

    .child-tag.eleanor { color: var(--eleanor); }
    .child-tag.oliver { color: var(--oliver); }

    .card-title {
      font-size: 1rem;
      font-weight: 650;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-notes {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.45rem;
      padding-top: 0.45rem;
      border-top: 1px solid var(--border);
    }

    .attach {
      margin-top: 0.45rem;
      font-size: 0.85rem;
    }

    .attach a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .attach a:hover { text-decoration: underline; }

    .empty {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

    @media (min-width: 560px) {
      header h1 { font-size: 1.75rem; }
      .wrap { padding: 1.75rem 1.25rem 3.5rem; }
    }

    /* —— Family tabs —— */
    .tab-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 1rem;
      padding: 0.25rem 0 0;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.55rem 0.75rem;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      border-radius: 6px 6px 0 0;
    }

    .tab-btn:hover { color: var(--text); background: rgba(43, 108, 176, 0.06); }
    .tab-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }

    .tab-panel[hidden] { display: none !important; }

    .school-brand {
      margin-bottom: 0.25rem;
    }

    .school-brand .school-heading {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-top: 0.35rem;
    }

    /* Placeholders */
    .placeholder-panel {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 1.25rem;
      box-shadow: var(--shadow);
      margin-top: 0.5rem;
    }

    .placeholder-panel h2 {
      font-size: 1rem;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .placeholder-panel p {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 36rem;
    }

    /* Custody / Key dates */
    :root {
      --alex: #1d4ed8;
      --alex-soft: #dbeafe;
      --anna: #9d174d;
      --anna-soft: #fce7f3;
    }

    .custody-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem 1rem;
      padding: 1rem 1.15rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin: 0.5rem 0 1.25rem;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .custody-banner.alex {
      background: var(--alex-soft);
      border-color: #93c5fd;
    }
    .custody-banner.anna-karin {
      background: var(--anna-soft);
      border-color: #f9a8d4;
    }
    .custody-banner.unknown {
      background: var(--surface);
    }

    .custody-banner .label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .custody-banner .who {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .custody-banner.alex .who { color: var(--alex); }
    .custody-banner.anna-karin .who { color: var(--anna); }

    .custody-banner .range {
      font-size: 0.9rem;
      color: var(--text-muted);
      width: 100%;
    }

    .custody-section h2 {
      margin-top: 0.25rem;
    }

    .custody-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .custody-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem 0.75rem;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .custody-item.alex {
      border-left: 4px solid var(--alex);
      background: linear-gradient(90deg, var(--alex-soft) 0%, var(--surface) 42%);
    }
    .custody-item.anna-karin {
      border-left: 4px solid var(--anna);
      background: linear-gradient(90deg, var(--anna-soft) 0%, var(--surface) 42%);
    }
    .custody-item.current {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .custody-item .parent-name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .custody-item.alex .parent-name { color: var(--alex); }
    .custody-item.anna-karin .parent-name { color: var(--anna); }

    .custody-item .dates {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .custody-item .days-pill {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(0,0,0,0.04);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }


    /* Sport & Hobbies */
    .sport-section {
      margin: 0.5rem 0 1.5rem;
    }

    .sport-section h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 0 0 0.65rem;
    }

    .sport-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .sport-item {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.45rem 0.75rem;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      border-left: 4px solid #64748b;
    }

    .sport-item.kind-match {
      border-left-color: #c2410c;
      background: linear-gradient(90deg, #ffedd5 0%, var(--surface) 42%);
    }
    .sport-item.kind-training {
      border-left-color: #15803d;
      background: linear-gradient(90deg, #dcfce7 0%, var(--surface) 42%);
    }
    .sport-item.kind-other {
      border-left-color: #64748b;
    }
    .sport-item.is-today {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .sport-item.is-next-match {
      box-shadow: 0 0 0 2px rgba(194, 65, 12, 0.35), var(--shadow);
    }

    .sport-item .event-when {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }
    .sport-item .event-summary {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
    }
    .sport-item .event-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .sport-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
    }

    .kind-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(0,0,0,0.06);
      color: var(--text-muted);
    }
    .kind-badge.match { background: #ffedd5; color: #9a3412; }
    .kind-badge.training { background: #dcfce7; color: #166534; }
    .kind-badge.other { background: #e2e8f0; color: #475569; }

    .sport-flag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
    }
    .sport-flag.next-match {
      background: #c2410c;
    }

    .msg-item {
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .msg-item .msg-date {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .msg-item .msg-subject {
      font-weight: 700;
      font-size: 0.95rem;
      margin: 0.2rem 0 0.35rem;
    }
    .msg-item .msg-summary {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .sport-placeholder-card {
      padding: 1rem 1.15rem;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.95rem;
    }


    /* Health appointments (reuse sport card layout) */
    .health-note {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0 0 0.85rem;
      line-height: 1.4;
    }

    .sport-item.kind-logoped {
      border-left-color: #7c3aed;
      background: linear-gradient(90deg, #ede9fe 0%, var(--surface) 42%);
    }
    .sport-item.kind-dentist {
      border-left-color: #0369a1;
      background: linear-gradient(90deg, #e0f2fe 0%, var(--surface) 42%);
    }

    .kind-badge.logoped { background: #ede9fe; color: #5b21b6; }
    .kind-badge.dentist { background: #e0f2fe; color: #075985; }

    .who-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
    }
    .who-badge.ollie { background: #dbeafe; color: #1e40af; }
    .who-badge.ellie { background: #fce7f3; color: #9d174d; }


    .custody-more-wrap {
      margin-top: 0.25rem;
    }
    .custody-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .custody-more-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .custody-more-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .custody-list-more {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.55rem;
    }

    .other-dates-section {
      margin-top: 1.75rem;
    }
    .other-dates-section h2 {
      margin-top: 0.25rem;
    }

    .sport-item.kind-trip {
      border-left-color: #0f766e;
      background: linear-gradient(90deg, #ccfbf1 0%, var(--surface) 42%);
    }
    .who-badge.alex { background: #dbeafe; color: #1e40af; }

    .custody-empty {
      color: var(--text-muted);
      padding: 1rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-top">
        <div>
          <h1 id="page-heading">Family dashboard</h1>
          <p class="sub" id="page-sub"></p>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" id="lang-en" data-lang="en" class="active">English</button>
          <span class="sep" aria-hidden="true">|</span>
          <button type="button" id="lang-sv" data-lang="sv">Svenska</button>
        </div>
      </div>
      <nav class="tab-nav" id="tab-nav" role="tablist" aria-label="Sections">
        <button type="button" class="tab-btn active" role="tab" id="tab-school" data-tab="school" aria-selected="true" aria-controls="panel-school">School</button>
        <button type="button" class="tab-btn" role="tab" id="tab-sport" data-tab="sport" aria-selected="false" aria-controls="panel-sport">Sport &amp; Hobbies</button>
        <button type="button" class="tab-btn" role="tab" id="tab-health" data-tab="health" aria-selected="false" aria-controls="panel-health">Health</button>
        <button type="button" class="tab-btn" role="tab" id="tab-keydates" data-tab="keydates" aria-selected="false" aria-controls="panel-keydates">Key dates</button>
      </nav>
    </header>

    <div id="panel-school" class="tab-panel" role="tabpanel" aria-labelledby="tab-school">
      <div class="school-brand">
        <p class="school-heading" id="school-heading">Homework &amp; Tests</p>
        <p class="sub" id="school-line">Källbrinksskolan</p>
        <div class="kids-row" id="kids-row"></div>
        <p class="updated" id="updated-line"></p>
      </div>

      <div class="filters" id="filters" role="group" aria-label="Filter items">

        weekdays: ["sön", "mån", "tis", "ons", "tor", "fre", "lör"],
        months: ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"]
      }
    };

    const SUBJECT_SV = {
      Math: "Matematik",
      Spanish: "Spanska",
      School: "Skola",
      English: "Engelska",
      Swedish: "Svenska",
      TK: "TK",
      PE: "Idrott",
      NO: "NO",
      "Hem- och konsumentkunskap": "Hem- och konsumentkunskap",

      try {
        const v = localStorage.getItem(LANG_KEY);
        if (v === "sv" || v === "en") return v;
      } catch (e) { /* ignore */ }
      return "en";
    }

    function saveLang(lang) {
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
    }

      return I18N[currentLang] || I18N.en;

    function typeLabel(type) {
      const map = {
        test: "typeTest",
        homework: "typeHomework",
        revision: "typeRevision",
        parent_action: "typeParentAction",
        event: "typeEvent"
      };
      const key = map[type];
      return key ? t()[key] : type;
    }

    function itemTitle(item) {
      if (currentLang === "sv" && item.title_sv) return item.title_sv;
      return item.title;
    }

    function itemNotes(item) {
      if (currentLang === "sv") {
        if (item.notes_sv != null) return item.notes_sv;
        if (item.notes == null) return null;
      }
      return item.notes;
    }

    function itemSubject(item) {
      if (currentLang === "sv") {
        return SUBJECT_SV[item.subject] || item.subject;
      }
      return item.subject;
    }

    /** Today in Europe/Stockholm as YYYY-MM-DD */
    function todayStockholm() {
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Stockholm",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date());
      } catch (e) {
        const d = new Date();
        return d.toISOString().slice(0, 10);
      }
    }

    function parseYMD(s) {
      if (!s) return null;
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(ymd, n) {
      const d = parseYMD(ymd);
      d.setDate(d.getDate() + n);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatDateLabel(item) {
      const i = t();
      if (item.ongoing) return i.thisWeek;
      if (!item.date) {
        if (item.week) return i.weekTbd.replace("{week}", item.week);
        return i.dateTbd;
      }
      const d = parseYMD(item.date);
      const base = `${i.weekdays[d.getDay()]} ${d.getDate()} ${i.months[d.getMonth()]}`;
      if (item.endDate) {
        const e = parseYMD(item.endDate);
        return `${base} – ${e.getDate()} ${i.months[e.getMonth()]}`;
      }
      if (item.time) return `${base} · ${item.time}`;
      return base;
    }

    function urgency(item, today) {
      if (item.ongoing) return "ongoing";
      if (!item.date) return null;
      if (item.date < today && !item.endDate) {
        if (item.type === "event" && item.endDate) return null;
        if (item.type === "event") return null;
        return "overdue";
      }
      if (item.endDate && item.date <= today && item.endDate >= today) return "today";
      if (item.endDate && item.endDate < today) return null;
      if (item.date === today) return "today";
      if (item.date === addDays(today, 1)) return "tomorrow";
      return null;
    }

    function urgencyLabel(u) {
      const i = t();
      if (u === "ongoing") return i.ongoingLabel;
      if (u === "today") return i.todayLabel;
      if (u === "tomorrow") return i.tomorrowLabel;
      if (u === "overdue") return i.overdueLabel;
      return u;
    }

    function sortKey(item) {
      if (item.date) return "0-" + item.date + "-" + (item.time || "99:99");
      if (item.week) return "1-week-" + String(item.week).padStart(2, "0");
      return "2-tbd-" + item.title;
    }

    function matchesFilter(item, filter) {
      if (filter === "all") return true;
      if (filter === "eleanor") return item.child === "eleanor";
      if (filter === "oliver") return item.child === "oliver";
      if (filter === "tests") return item.type === "test";
      if (filter === "homework") return item.type === "homework" || item.type === "revision";
      return true;
    }

    function kidName(id, kids) {
      const k = kids.find((x) => x.id === id);
      return k ? k.name.split(" ")[0] : id;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderCard(item, kids, today) {
      const i = t();
      const u = urgency(item, today);
      const childFirst = kidName(item.child, kids);
      const typeClass = item.type;
      const urgencyClass = u ? `urgency-${u}` : "";
      const urgencyHtml = u
        ? `<span class="urgency-tag ${u}">${escapeHtml(urgencyLabel(u))}</span>`
        : "";
      const optionalHtml = item.optional

        : "";
      const classroomHtml = item.on_classroom
        ? `<span class="badge badge-classroom">${escapeHtml(i.classroomPrompt)}</span>`
        : "";
      const attachmentHtml = item.has_attachment
        ? `<span class="badge badge-attachment">${escapeHtml(item.attachment_status === "pending_vklass" ? i.attachmentVklass : i.worksheet)}</span>`
        : "";
      const attachmentLinkHtml = item.attachment_url
        ? `<p class="attach"><a href="${escapeHtml(item.attachment_url)}" target="_blank" rel="noopener">${escapeHtml(i.openWorksheet)}</a></p>`
        : "";
      const notes = itemNotes(item);
      const notesHtml = notes
        ? `<p class="card-notes">${escapeHtml(notes)}</p>`
        : "";

      return `
        <article class="card type-${typeClass} ${urgencyClass}" data-child="${item.child}" data-type="${item.type}">
          <div class="card-top">
            <span class="date-label">${escapeHtml(formatDateLabel(item))}</span>
            ${urgencyHtml}
            <span class="badge ${typeClass}">${escapeHtml(typeLabel(item.type))}</span>
            ${optionalHtml}${classroomHtml}${attachmentHtml}
            <span class="child-tag ${item.child}">${escapeHtml(childFirst)}</span>
          </div>
          <h3 class="card-title">${escapeHtml(itemTitle(item))}</h3>
          <p class="card-meta">${escapeHtml(itemSubject(item))}</p>
          ${notesHtml}${attachmentLinkHtml}
        </article>
      `;
    }

    function sectionHtml(title, items, kids, today) {
      const i = t();
      if (!items.length) {
        return `
          <section>
            <h2>${escapeHtml(title)} <span class="count">0</span></h2>
            <div class="empty">${escapeHtml(i.empty)}</div>
          </section>`;

      return `

        </section>`;

    function parentLabel(parentId) {

    function formatRange(startYmd, endYmd) {
      const i = t();
      const s = parseYMD(startYmd);
      const e = parseYMD(endYmd);
      if (!s || !e) return "";
      const sameMonth = s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear();
      const left = `${i.weekdays[s.getDay()]} ${s.getDate()} ${i.months[s.getMonth()]}`;
      const right = sameMonth
        ? `${i.weekdays[e.getDay()]} ${e.getDate()}`
        : `${i.weekdays[e.getDay()]} ${e.getDate()} ${i.months[e.getMonth()]}`;
      if (s.getFullYear() !== e.getFullYear()) {
        return `${left} ${s.getFullYear()} – ${right} ${e.getFullYear()}`;
      }
      return `${left} – ${right}`;
    }

    function findCurrentBlock(blocks, today) {
      if (!blocks) return null;
      return blocks.find((b) => b.start <= today && today <= b.end) || null;
    }

    function upcomingBlocks(blocks, today, weeksAhead) {
      if (!blocks) return [];
      const horizon = addDays(today, weeksAhead * 7);
      return blocks.filter((b) => b.end >= today && b.start <= horizon);
    }

    function custodyItemHtml(b, current, i) {
      const isCurrent = current && b.start === current.start && b.end === current.end && b.parent === current.parent;
      const name = parentLabel(b.parent);
      return `
          <article class="custody-item ${b.parent}${isCurrent ? " current" : ""}">
            <div>

          </article>`;

    function renderCustody() {
      const i = t();
      const banner = document.getElementById("custody-banner");
      const list = document.getElementById("custody-list");
      const heading = document.getElementById("custody-upcoming-heading");
      heading.textContent = i.upcomingCustody;

      if (custodyLoadState === "pending") {
        banner.className = "custody-banner unknown";
        banner.innerHTML = `<div class="label">${escapeHtml(i.thisWeekCustody)}</div><div class="who">…</div>`;
        list.innerHTML = "";
        return;
      }

      if (custodyLoadState === "error" || !custodyData) {
        banner.className = "custody-banner unknown";
        banner.innerHTML = `<div class="label">${escapeHtml(i.thisWeekCustody)}</div><div class="who">—</div><div class="range">${escapeHtml(i.custodyLoadError)}</div>`;
        list.innerHTML = `<div class="custody-empty">${escapeHtml(i.custodyLoadError)}</div>`;
        return;
      }

      const today = todayStockholm();
      const current = findCurrentBlock(custodyData.blocks, today);
      if (current) {
        banner.className = `custody-banner ${current.parent}`;
        const name = parentLabel(current.parent);
        banner.innerHTML = `

      } else {
        banner.className = "custody-banner unknown";

          <div class="who">—</div>
          <div class="range">${escapeHtml(i.custodyNone)}</div>`;
      }

      const near = upcomingBlocks(custodyData.blocks, today, CUSTODY_WEEKS_NEAR);
      const all = upcomingBlocks(custodyData.blocks, today, CUSTODY_WEEKS_ALL);
      if (!all.length) {
        list.innerHTML = `<div class="custody-empty">${escapeHtml(i.custodyEmptyUpcoming)}</div>`;
        return;
      }

      const rest = all.slice(near.length);
      const visible = custodyShowMore ? all : near;
      let html = visible.map((b) => custodyItemHtml(b, current, i)).join("");
      if (rest.length) {
        html += `<div class="custody-more-wrap">

    function kindLabel(kind) {

    function eventStartDate(ev) {
      if (!ev || !ev.start) return null;
      return ev.start.slice(0, 10);
    }

    function formatEventWhen(ev) {
      const i = t();
      const datePart = eventStartDate(ev);
      if (!datePart) return "";
      const d = parseYMD(datePart);
      const base = `${i.weekdays[d.getDay()]} ${d.getDate()} ${i.months[d.getMonth()]}`;
      // Timed: 2026-09-22T18:30+02:00
      const tm = ev.start.match(/T(\d{2}):(\d{2})/);
      if (tm) return `${base} · ${tm[1]}:${tm[2]}`;
      return base;
    }

    function upcomingSportEvents(events, today, horizonDays, maxCount) {
      const end = addDays(today, horizonDays);
      const list = (events || []).filter((ev) => {
        const d = eventStartDate(ev);
        return d && d >= today && d <= end;
      });
      return list.slice(0, maxCount);
    }

    function findNextMatch(events, today) {
      return (events || []).find((ev) => {
        const d = eventStartDate(ev);
        return ev.kind === "match" && d && d >= today;
      }) || null;
    }

    function renderSport() {
      const i = t();
      const eventsEl = document.getElementById("sport-events");
      const messagesEl = document.getElementById("sport-messages");
      if (!eventsEl || !messagesEl) return;

      if (sportEventsLoadState === "pending") {
        eventsEl.innerHTML = `<div class="custody-empty">…</div>`;
      } else if (sportEventsLoadState === "error" || !sportEventsData) {
        eventsEl.innerHTML = `<div class="custody-empty">${escapeHtml(i.sportEventsLoadError)}</div>`;
      } else {
        const today = todayStockholm();
        const upcoming = upcomingSportEvents(sportEventsData.events, today, 42, 20);
        const nextMatch = findNextMatch(sportEventsData.events, today);
        if (!upcoming.length) {
          eventsEl.innerHTML = `<div class="custody-empty">${escapeHtml(i.sportEventsEmpty)}</div>`;
        } else {
          eventsEl.innerHTML = upcoming.map((ev) => {
            const d = eventStartDate(ev);
            const isToday = d === today;
            const isNextMatch = nextMatch && ev.start === nextMatch.start && ev.summary === nextMatch.summary;
            const flags = [];
            if (isToday) flags.push(`<span class="sport-flag">${escapeHtml(i.todayLabel)}</span>`);
            if (isNextMatch) flags.push(`<span class="sport-flag next-match">${escapeHtml(i.nextMatchFlag)}</span>`);
            const gathering = ev.gathering
              ? `<div class="event-meta">${escapeHtml(i.gatheringLabel.replace("{time}", ev.gathering))}</div>`
              : "";
            const loc = ev.location
              ? `<div class="event-meta">${escapeHtml(ev.location)}</div>`
              : "";
            return `
              <article class="sport-item kind-${escapeHtml(ev.kind || "other")}${isToday ? " is-today" : ""}${isNextMatch ? " is-next-match" : ""}">
                <div>

              </article>`;
          }).join("");

      }

    function formatOtherWhen(ev) {
      const i = t();
      const startYmd = eventStartDate(ev);
      if (!startYmd) return "";
      const endYmd = eventEndDate(ev) || startYmd;
      const s = parseYMD(startYmd);
      const e = parseYMD(endYmd);
      if (!s || !e) return "";
      const startTm = (ev.start || "").match(/T(\d{2}):(\d{2})/);
      const endTm = (ev.end || "").match(/T(\d{2}):(\d{2})/);
      const left = `${i.weekdays[s.getDay()]} ${s.getDate()} ${i.months[s.getMonth()]}`;
      const leftWithTime = startTm ? `${left} · ${startTm[1]}:${startTm[2]}` : left;
      if (startYmd === endYmd) {
        if (startTm && endTm) return `${left} · ${startTm[1]}:${startTm[2]}–${endTm[1]}:${endTm[2]}`;
        return leftWithTime;
      }
      const sameMonth = s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear();
      const right = sameMonth
        ? `${i.weekdays[e.getDay()]} ${e.getDate()}`
        : `${i.weekdays[e.getDay()]} ${e.getDate()} ${i.months[e.getMonth()]}`;
      const rightWithTime = endTm ? `${right} · ${endTm[1]}:${endTm[2]}` : right;
      return `${leftWithTime} – ${rightWithTime}`;
    }

    function upcomingOtherEvents(events, today) {
      return (events || [])
        .filter((ev) => {
          const start = eventStartDate(ev);
          const end = eventEndDate(ev) || start;
          return end && end >= today;
        })
        .slice()
        .sort((a, b) => String(a.start || "").localeCompare(String(b.start || "")));
    }

    function otherWhoBadges(whoList) {
      const names = Array.isArray(whoList) ? whoList : (whoList ? [whoList] : []);
      return names.map((w) => {
        const label = whoLabel(w);
        const cls = whoClass(w) || ((w || "").toLowerCase() === "alex" ? "alex" : "");
        return `<span class="who-badge ${escapeHtml(cls)}">${escapeHtml(label || w)}</span>`;
      }).join("");
    }

    function renderOtherDates() {
      const i = t();
      const heading = document.getElementById("other-dates-heading");
      const list = document.getElementById("other-dates-list");
      if (!heading || !list) return;
      heading.textContent = i.otherImportantDates;

      if (otherDatesLoadState === "pending") {
        list.innerHTML = `<div class="custody-empty">…</div>`;
        return;
      }
      if (otherDatesLoadState === "error" || !otherDatesData) {
        list.innerHTML = `<div class="custody-empty">${escapeHtml(i.otherDatesLoadError)}</div>`;
        return;
      }

      const today = todayStockholm();
      const upcoming = upcomingOtherEvents(otherDatesData.events, today);
      if (!upcoming.length) {
        list.innerHTML = `<div class="custody-empty">${escapeHtml(i.otherDatesEmpty)}</div>`;
        return;
      }

      list.innerHTML = upcoming.map((ev) => {
        const start = eventStartDate(ev);
        const end = eventEndDate(ev) || start;
        const isToday = start && start <= today && end >= today;
        const summary = currentLang === "sv"
          ? (ev.summary_sv || ev.summary || "")
          : (ev.summary || ev.summary_sv || "");
        const notesRaw = currentLang === "sv"
          ? (ev.notes_sv || ev.notes || "")
          : (ev.notes || ev.notes_sv || "");
        const notes = (notesRaw || "").trim();
        const loc = ev.location
          ? `<div class="event-meta">${escapeHtml(ev.location)}</div>`
          : "";
        const notesHtml = notes
          ? `<div class="event-meta">${escapeHtml(notes)}</div>`
          : "";
        const flags = [];
        if (isToday) flags.push(`<span class="sport-flag">${escapeHtml(i.todayLabel)}</span>`);
        return `
          <article class="sport-item kind-trip${isToday ? " is-today" : ""}">
            <div>
              <div class="event-when">${escapeHtml(formatOtherWhen(ev))}</div>
              <div class="event-summary">${escapeHtml(summary)}</div>
              ${loc}
              ${notesHtml}
            </div>
            <div class="sport-badges">
              ${otherWhoBadges(ev.who)}
              ${flags.join("")}
            </div>
          </article>`;
      }).join("");
    }


    function renderDrums() {
      const i = t();
      const el = document.getElementById("drums-body");
      if (!el) return;
      if (drumsLoadState === "pending") {
        el.innerHTML = "";
        return;
      }
      if (drumsLoadState === "error" || !drumsData) {
        el.innerHTML = `<div class="custody-empty">${escapeHtml(i.drumsLoadError)}</div>`;
        return;
      }
      const d = drumsData;
      const dayLabel = currentLang === "sv" ? (d.day_sv || d.day) : d.day;
      const schedule = `${dayLabel} ${d.time_start}–${d.time_end}`;
      const teacherBits = [d.teacher, d.teacher_email, d.teacher_phone].filter(Boolean).join(" · ");
      const title = currentLang === "sv" ? "Trummor / slagverk" : "Drums / percussion";
      el.innerHTML = `<article class="sport-item kind-other">
          <div class="sport-when">${escapeHtml(schedule)}</div>
          <div class="sport-summary">${escapeHtml(title)}</div>
          <div class="sport-location">${escapeHtml(d.location || "")}${d.room ? " · " + escapeHtml(d.room) : ""}</div>
          <div class="sport-location">${escapeHtml(i.drumsCourseStart)}: ${escapeHtml(d.course_start || "")}</div>
          ${teacherBits ? `<div class="sport-location">${escapeHtml(i.drumsTeacher)}: ${escapeHtml(teacherBits)}</div>` : ""}
          <div class="sport-badges">
            <span class="who-badge ollie">${escapeHtml(d.who || "Ollie")}</span>
            ${d.course ? `<span class="kind-badge other">${escapeHtml(d.course)}</span>` : ""}
          </div>
        </article>`;
    }

    async function loadDrumsFeed() {
      drumsLoadState = "pending";
      renderDrums();
      try {
        const res = await fetch("feeds/drums.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        drumsData = await res.json();
        drumsLoadState = "ok";
      } catch (e) {
        drumsData = null;
        drumsLoadState = "error";
      }
      renderDrums();
    }

    async function loadOtherDatesFeed() {
      otherDatesLoadState = "pending";
      renderOtherDates();
      try {
        const res = await fetch("feeds/other-dates.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        otherDatesData = await res.json();
        otherDatesLoadState = "ok";
      } catch (e) {
        otherDatesData = null;
        otherDatesLoadState = "error";
      }
      renderOtherDates();
    }

    async function loadCustodyFeed() {
      custodyLoadState = "pending";
      renderCustody();
      try {
        const res = await fetch("feeds/coparenting.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        custodyData = await res.json();
        custodyLoadState = "ok";
      } catch (e) {
        custodyData = null;
        custodyLoadState = "error";
      }
      renderCustody();
    }

    function setTab(tab) {
      if (!VALID_TABS.includes(tab)) tab = "school";
      currentTab = tab;
      saveTab(tab);
      VALID_TABS.forEach((id) => {
        const panel = document.getElementById("panel-" + id);
        const btn = document.getElementById("tab-" + id);
        const active = id === currentTab;
        if (panel) panel.hidden = !active;
        if (btn) {
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        }
      });
    }

    function applyChrome() {
      const i = t();
      document.documentElement.lang = currentLang;
      document.title = i.docTitle;
      document.getElementById("page-heading").textContent = i.pageHeading;
      document.getElementById("page-sub").textContent = i.pageSub;
      document.getElementById("school-heading").textContent = i.schoolHeading;
      document.getElementById("filters").setAttribute("aria-label", i.filterAria);
      document.querySelector(".lang-toggle").setAttribute("aria-label", i.langAria);
      document.getElementById("tab-nav").setAttribute("aria-label", i.tabAria);

      const tabLabels = {
        school: i.tabSchool,
        sport: i.tabSport,
        health: i.tabHealth,
        keydates: i.tabKeydates
      };
      Object.keys(tabLabels).forEach((id) => {
        const btn = document.getElementById("tab-" + id);
        if (btn) btn.textContent = tabLabels[id];
      });

      document.getElementById("football-heading").textContent = i.footballHeading;
      document.getElementById("sport-messages-heading").textContent = i.sportMessagesHeading;
      document.getElementById("drums-heading").textContent = i.drumsHeading;
      renderDrums();
      document.getElementById("health-title").textContent = i.healthTitle;
      const otherHeading = document.getElementById("other-dates-heading");
      if (otherHeading) otherHeading.textContent = i.otherImportantDates;

      const chipLabels = {
        all: i.filterAll,
        eleanor: i.filterEllie,
        oliver: i.filterOliver,
        tests: i.filterTests,
        homework: i.filterHomework
      };
      document.querySelectorAll(".chip").forEach((c) => {
        const label = chipLabels[c.dataset.filter];
        if (label) c.textContent = label;
      });

      document.getElementById("lang-en").classList.toggle("active", currentLang === "en");
      document.getElementById("lang-sv").classList.toggle("active", currentLang === "sv");
    }

    function renderSchool() {
      const i = t();
      const data = DASHBOARD_DATA;
      const today = todayStockholm();
      const kids = data.kids;
      const items = [...data.items].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
      const filtered = items.filter((it) => matchesFilter(it, currentFilter));

      document.getElementById("school-line").textContent = data.school;
      document.getElementById("kids-row").innerHTML = kids.map((k) => {
        let extra = "";
        if (k.notes) {
          const note = k.notes === "fritids" ? i.fritidsNote : k.notes;
          extra = ` · ${note}`;
        }
        return `<span class="kid-pill ${k.id}">${escapeHtml(k.name)} · ${escapeHtml(k.class)}${escapeHtml(extra)}</span>`;
      }).join("");

      const updatedDate = parseYMD(data.updated);
      const updatedLabel = updatedDate
        ? `${updatedDate.getDate()} ${i.months[updatedDate.getMonth()]} ${updatedDate.getFullYear()}`
        : data.updated;
      document.getElementById("updated-line").textContent =
        `${i.lastUpdated}: ${updatedLabel} · Europe/Stockholm · ${i.todayPrefix}: ${formatDateLabel({ date: today })}`;

      const end7 = addDays(today, 7);
      const upcoming = filtered.filter((it) => {
        if (it.ongoing) return true;
        if (!it.date) return false;
        if (it.endDate) return it.date <= end7 && it.endDate >= today;
        return it.date >= today && it.date <= end7;
      });

      const eleanor = filtered.filter((it) => it.child === "eleanor");
      const oliver = filtered.filter((it) => it.child === "oliver");
      const parentActions = filtered.filter((it) => it.type === "parent_action");

      const main = document.getElementById("main");
      let html = "";
      html += sectionHtml(i.sectionUpcoming, upcoming, kids, today);
      if (currentFilter !== "oliver") {
        html += sectionHtml(i.sectionEllie, eleanor, kids, today);
      }
      if (currentFilter !== "eleanor") {
        html += sectionHtml(i.sectionOliver, oliver, kids, today);
      }
      html += sectionHtml(i.sectionParent, parentActions, kids, today);
      main.innerHTML = html;
    }

    function render() {
      applyChrome();
      setTab(currentTab);
      renderSchool();
      renderCustody();
      renderOtherDates();
      renderSport();
      renderHealth();
    }

    function setLang(lang) {
      if (lang !== "en" && lang !== "sv") return;
      currentLang = lang;
      saveLang(lang);
      render();
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c === btn));
      renderSchool();
    });

    document.getElementById("tab-nav").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      setTab(btn.dataset.tab);
    });

    document.querySelector(".lang-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      setLang(btn.dataset.lang);
    });

    document.getElementById("custody-list").addEventListener("click", (e) => {
      const btn = e.target.closest("#custody-see-more");
      if (!btn) return;
      custodyShowMore = !custodyShowMore;
      renderCustody();
    });

    const filtersEl = document.getElementById("filters");
    const observer = new IntersectionObserver(
      ([entry]) => filtersEl.classList.toggle("is-stuck", entry.intersectionRatio < 1),
      { threshold: [1], rootMargin: "-1px 0px 0px 0px" }
    );
    observer.observe(filtersEl);

    render();
    loadCustodyFeed();
    loadOtherDatesFeed();
    loadSportFeeds();
    loadDrumsFeed();
    loadHealthFeed();
  </script>
</body>
</html>
